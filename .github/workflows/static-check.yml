name: static-check
on:
  push:
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Rootfs script checks
        run: sh tests/static-check.sh
      - name: Boot log checker self-test
        run: python3 linux/tests/test-check-boot-log.py
