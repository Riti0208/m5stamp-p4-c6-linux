# M3-lab only.  BusyBox inetd starts one Dropbear per connection.
# nowait.3 caps concurrent Dropbear children (each costs ~563 KB of RAM).
# -w disables root login, -g disallows root password login, and -r points at
# a volatile host key generated once by S85easystick-ssh.
22 stream tcp nowait.3 root /usr/sbin/dropbear dropbear -i -w -g -r /tmp/dropbear_ed25519_host_key
