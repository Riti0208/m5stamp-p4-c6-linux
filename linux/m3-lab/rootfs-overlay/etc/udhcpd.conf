# /etc/udhcpd.conf - BusyBox udhcpd configuration for M5Stamp P4 SoftAP
# No router/dns options: this AP has no uplink and no DNS server, and
# advertising them steals the clients' default route and DNS.
start 192.168.4.2
end 192.168.4.20
interface wlan0
max_leases 10
lease_file /run/udhcpd.leases
opt subnet 255.255.255.0
opt lease 3600
